<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una invitación especial</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #292016;
      font-family: Georgia, serif;
      color: #f8e9c9;
      padding: 24px 12px;
    }

    h1 {
      text-align: center;
      font-size: clamp(22px, 5vw, 34px);
      font-weight: normal;
      margin: 0 0 10px;
    }

    p {
      text-align: center;
      color: #d9c5a0;
      margin: 0 0 22px;
    }

    .book {
      width: min(92vw, 520px);
      position: relative;
      background: #ead9b6;
      padding: 10px;
      border: 3px solid #ad8b55;
      border-radius: 5px;
      box-shadow: 0 15px 40px #0009;
    }

    .page {
      display: none;
      width: 100%;
      animation: aparecer .35s ease;
    }

    .page.active {
      display: block;
    }

    .page img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 68vh;
      object-fit: contain;
    }

    @keyframes aparecer {
      from { opacity: .3; transform: translateX(8px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      width: min(92vw, 520px);
    }

    button {
      background: #a7834e;
      color: white;
      border: 1px solid #d5bb8d;
      padding: 12px 18px;
      font-family: Georgia, serif;
      font-size: 15px;
      border-radius: 4px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .4;
      cursor: default;
    }

    #counter {
      color: #f8e9c9;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>Una invitación especial</h1>
  <p>Una pequeña historia para un día inolvidable</p>

  <div class="book">
<div class="page active"><img src="/invitacion-salome/page-1.webp" alt="Portada"></div>
<div class="page"><img src="/invitacion-salome/page-2.webp" alt="Página 2"></div>
<div class="page"><img src="/invitacion-salome/page-3.webp" alt="Página 3"></div>
<div class="page"><img src="/invitacion-salome/page-4.webp" alt="Página 4"></div>
<div class="page"><img src="/invitacion-salome/page-5.webp" alt="Página 5"></div>
<div class="page"><img src="/invitacion-salome/page-6.webp" alt="Página 6"></div>
  </div>

  <div class="controls">
    <button id="prev" onclick="changePage(-1)">← Anterior</button>
    <span id="counter">Página 1 de 6</span>
    <button id="next" onclick="changePage(1)">Siguiente →</button>
  </div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  let currentPage = 0;
  const pages = document.querySelectorAll('.page');
  const counter = document.getElementById('counter');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');

  function changePage(direction) {
    currentPage = currentPage + direction;

    pages.forEach(function (page, index) {
      page.classList.toggle('active', index === currentPage);
    });

    counter.textContent = 'Página ' + (currentPage + 1) + ' de ' + pages.length;
    prev.disabled = currentPage === 0;
    next.disabled = currentPage === pages.length - 1;
  }

  prev.addEventListener('click', function () {
    if (currentPage > 0) changePage(-1);
  });

  next.addEventListener('click', function () {
    if (currentPage < pages.length - 1) changePage(1);
  });

  prev.disabled = true;
  next.disabled = pages.length <= 1;
});
</script>
</body>
</html>
