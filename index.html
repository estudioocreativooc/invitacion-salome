<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una invitación especial</title>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #292016;
      color: #f8e9c9;
      font-family: Georgia, serif;
    }

    h1 {
      text-align: center;
      font-size: clamp(23px, 5vw, 35px);
      font-weight: normal;
      margin: 0 0 10px;
    }

    .subtitle {
      text-align: center;
      color: #d9c5a0;
      margin: 0 0 25px;
    }

    #book {
      width: min(96vw, 780px);
      margin: 0 auto;
    }

    .page {
      background: #f1e4c9;
      overflow: hidden;
      border: 1px solid #b79b6a;
    }

    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #f1e4c9;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 25px;
    }

    button {
      background: #a7834e;
      color: white;
      border: 1px solid #d5bb8d;
      padding: 12px 18px;
      border-radius: 4px;
      font-family: Georgia, serif;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .4;
      cursor: default;
    }

    #counter {
      font-size: 14px;
      white-space: nowrap;
    }

    .hint {
      margin-top: 16px;
      text-align: center;
      color: #d9c5a0;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <h1>Una invitación especial</h1>
  <p class="subtitle">Una pequeña historia para un día inolvidable</p>

  <div id="book">
    <div class="page">
      <img src="page-1.webp" alt="Página 1">
    </div>
    <div class="page">
      <img src="page-2.webp" alt="Página 2">
    </div>
    <div class="page">
      <img src="page-3.webp" alt="Página 3">
    </div>
    <div class="page">
      <img src="page-4.webp" alt="Página 4">
    </div>
    <div class="page">
      <img src="page-5.webp" alt="Página 5">
    </div>
    <div class="page">
      <img src="page-6.webp" alt="Página 6">
    </div>
  </div>

  <div class="controls">
    <button id="prev" type="button">← Anterior</button>
    <span id="counter">Página 1 de 6</span>
    <button id="next" type="button">Siguiente →</button>
  </div>

  <p class="hint">También puedes tocar las esquinas del libro para pasar las páginas</p>

  <script>
    const bookElement = document.getElementById('book');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');

    if (typeof St !== 'undefined' && St.PageFlip) {
      const flipBook = new St.PageFlip(bookElement, {
        width: 390,
        height: 550,
        size: 'stretch',
        minWidth: 280,
        maxWidth: 780,
        minHeight: 350,
        maxHeight: 650,
        showCover: false,
        usePortrait: false,
        flippingTime: 900,
        drawShadow: true,
        maxShadowOpacity: 0.4,
        mobileScrollSupport: false,
        clickEventForward: true
      });

      flipBook.loadFromHTML(
        document.querySelectorAll('#book .page')
      );

      function updateControls() {
        const current = flipBook.getCurrentPageIndex();
        counter.textContent = 'Página ' + (current + 1) + ' de 6';
        prev.disabled = current === 0;
        next.disabled = current >= 5;
      }

      prev.addEventListener('click', function () {
        flipBook.flipPrev();
      });

      next.addEventListener('click', function () {
        flipBook.flipNext();
      });

      flipBook.on('flip', updateControls);
      updateControls();
    } else {
      counter.textContent = 'No se pudo cargar el libro. Recarga la página.';
      prev.disabled = true;
      next.disabled = true;
    }
  </script>
</body>
</html>
