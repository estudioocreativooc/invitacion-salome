<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eaf0fa">
  <title>Invitación | Los quince de Salomé</title>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 10px;
      background: #eaf0fa;
      font-family: Georgia, "Times New Roman", serif;
      color: #242235;
    }

    .heading {
      text-align: center;
      margin-bottom: 16px;
    }

    .heading h1 {
      font-size: clamp(21px, 4vw, 32px);
      font-weight: normal;
      margin: 0 0 6px;
    }

    .heading p {
      font-size: 14px;
      margin: 0;
      color: #5b5a70;
    }

    #book {
      margin: 0 auto;
    }

    .page {
      position: relative;
      overflow: hidden;
      background: #fff;
    }

    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Nombre personalizado de la quinta página */
    .personalize {
      position: absolute;
      left: 10%;
      width: 80%;
      top: 29%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: transparent;
      padding: 0;
      color: #242235;
      pointer-events: none;
    }

    .guest-name {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 600;
      font-size: clamp(14px, 2.5vw, 23px);
      line-height: 1.2;
      overflow-wrap: anywhere;
      max-width: 100%;
    }

    .validity {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(9px, 1.5vw, 14px);
      line-height: 1.2;
      margin-top: 5px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
    }

    .controls button {
      border: 1px solid #c3ccdf;
      border-radius: 24px;
      background: #fff;
      color: #242235;
      font-family: Georgia, serif;
      font-size: 15px;
      padding: 10px 18px;
      cursor: pointer;
    }

    .controls button:active {
      background: #dce5f5;
    }

    #pageStatus {
      min-width: 72px;
      text-align: center;
      font-size: 13px;
      color: #5b5a70;
    }

    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: #68677b;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px 6px;
      }

      .heading {
        margin-bottom: 12px;
      }

      .controls {
        margin-top: 14px;
        gap: 8px;
      }

      .controls button {
        padding: 9px 13px;
      }
    }
  </style>
</head>

<body>
  <header class="heading">
    <h1>Los quince de Salomé</h1>
    <p>Una invitación especial para ti</p>
  </header>

  <main>
    <div id="book">
      <div class="page">
        <img src="page-1.webp" alt="Portada de la invitación">
      </div>

      <div class="page">
        <img src="page-2.webp" alt="Invitación de Salomé">
      </div>

      <div class="page">
        <img src="page-3.webp" alt="Detalles de la celebración">
      </div>

      <div class="page">
        <img src="page-4.webp" alt="Información de la celebración">
      </div>

      <div class="page">
        <img src="page-5.webp" alt="Invitación personalizada">

        <div class="personalize">
          <div id="guestName" class="guest-name">
            Nombre del invitado
          </div>

          <div id="validity" class="validity">
            Esta invitación es válida para una persona.
          </div>
        </div>
      </div>

      <div class="page">
        <img src="page-6.webp" alt="Cierre de la invitación">
      </div>
    </div>

    <div class="controls">
      <button type="button" id="prevButton">← Anterior</button>
      <span id="pageStatus">Página 1 de 6</span>
      <button type="button" id="nextButton">Siguiente →</button>
    </div>

    <p class="hint">También puedes pasar las páginas tocando sus bordes.</p>
  </main>

  <script>
    // Personalización mediante la dirección web
    const params = new URLSearchParams(window.location.search);

    const guest = (params.get("invitado") || "Nombre del invitado")
      .replace(/[<>]/g, "")
      .trim()
      .slice(0, 80);

    const rawPeople = Number.parseInt(
      params.get("personas") || "1",
      10
    );

    const people = Number.isFinite(rawPeople)
      ? Math.max(1, Math.min(30, rawPeople))
      : 1;

    document.getElementById("guestName").textContent =
      guest || "Nombre del invitado";

    document.getElementById("validity").textContent =
      "Esta invitación es válida para " +
      people +
      (people === 1 ? " persona." : " personas.");

    // Configuración del libro
    const bookElement = document.getElementById("book");
    const pageStatus = document.getElementById("pageStatus");

    const pageFlip = new St.PageFlip(bookElement, {
      width: 400,
      height: 600,
      size: "stretch",
      minWidth: 280,
      maxWidth: 600,
      minHeight: 420,
      maxHeight: 900,
      showCover: true,
      usePortrait: true,
      drawShadow: true,
      flippingTime: 700,
      mobileScrollSupport: false,
      maxShadowOpacity: 0.25
    });

    pageFlip.loadFromHTML(
      document.querySelectorAll("#book .page")
    );

    function updateStatus() {
      const current = pageFlip.getCurrentPageIndex() + 1;
      pageStatus.textContent = "Página " + current + " de 6";
    }

    pageFlip.on("flip", updateStatus);

    document.getElementById("prevButton").addEventListener(
      "click",
      () => pageFlip.flipPrev()
    );

    document.getElementById("nextButton").addEventListener(
      "click",
      () => pageFlip.flipNext()
    );

    window.addEventListener("resize", updateStatus);

    updateStatus();
  </script>
</body>
</html>
