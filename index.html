
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis quince años · Salomé</title>
<meta name="description" content="Una invitación muy especial a los quince años de Salomé.">

<style>
:root {
  --ink: #252235;
  --paper: #f5ead4;
  --blue: #243454;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(
    ellipse at top,
    #f0e7f0,
    #d8d0df 65%,
    #b7aabd
  );
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 12px;
  overflow-x: hidden;
}

.header {
  text-align: center;
  margin: 0 0 24px;
}

.eyebrow {
  font-size: 0.72rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  opacity: 0.78;
}

.header h1 {
  font-weight: normal;
  font-size: clamp(1.2rem, 4vw, 1.8rem);
  margin: 6px 0 0;
  font-style: italic;
}

/* Escenario del libro */
.book-stage {
  width: min(100%, 850px);
  margin: 0 auto;
  padding: 0 12px 15px 8px;
  perspective: 1800px;
}

/* Cubierta exterior */
.book-shell {
  position: relative;
  width: 100%;
  padding: 7px;
  border-radius: 3px 5px 5px 3px;
  background: linear-gradient(
    90deg,
    #17233e 0%,
    #263657 2%,
    #e8dcc8 3%,
    #fff8e9 4%,
    #d7c7b5 96%,
    #b8a68f 98%,
    #1b2945 100%
  );
  box-shadow:
    0 3px 0 #17213a,
    3px 6px 0 #253454,
    7px 10px 0 #b8a9c4,
    12px 17px 24px #30243b45;
  transform-style: preserve-3d;
}

.book-shell::before {
  content: "";
  position: absolute;
  z-index: 0;
  top: 0;
  bottom: 0;
  left: -8px;
  width: 12px;
  border-radius: 4px 0 0 4px;
  background: linear-gradient(
    90deg,
    #17233e,
    #354767 45%,
    #192642
  );
  box-shadow:
    inset 1px 0 2px #ffffff35,
    inset -2px 0 3px #10192b80;
  pointer-events: none;
}

.book-shell::after {
  content: "";
  position: absolute;
  z-index: 5;
  top: 8px;
  right: -5px;
  bottom: 8px;
  width: 5px;
  border-radius: 0 2px 2px 0;
  background: repeating-linear-gradient(
    to bottom,
    #fff9ed 0,
    #e3d4bf 2px,
    #fff9ed 4px
  );
  pointer-events: none;
}

/* PageFlip controla el tamaño y la posición del libro */
#book {
  position: relative;
  margin: 0 auto;
  background: var(--paper);
  box-shadow: 0 0 0 1px #b8a88f;
  transform-style: preserve-3d;
}

/* Páginas */
.page {
  position: relative;
  overflow: hidden;
  background: var(--paper);
  border: 1px solid #d5c4a9;
}

.page img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}


/* Nombre y cantidad de invitados */
.personalize {
  position: absolute;
  z-index: 2;
  top: 30%;
  left: 50%;
  transform: translateX(-50%);
  width: 80%;
  min-height: 12%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: transparent;
  padding: 3px 4px;
  color: #242235;
  font-size: 20px;
  line-height: 1.4;
  font-weight: 500;
  pointer-events: none;
}

.guest-name {
  font-variant: small-caps;
  font-weight: 600;
  font-size: clamp(12px, 2.3vw, 22px);
  line-height: 1.15;
  overflow-wrap: anywhere;
  max-width: 100%;
  text-align: center;
}

.validity {
  font-variant: small-caps;
  font-weight: 600;
  font-size: clamp(8px, 1.4vw, 14px);
  line-height: 1.2;
  margin-top: 5px;
  text-align: center;
}

/* Controles */
.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-top: 22px;
  width: 100%;
}

.controls button {
  border: 1px solid #6c5c77;
  background: #f7f0e5;
  color: #2b2436;
  border-radius: 999px;
  padding: 10px 17px;
  font: inherit;
  cursor: pointer;
  box-shadow: 0 3px 10px #30243b22;
}

.controls button:active {
  transform: translateY(1px);
}

.controls button:disabled {
  opacity: 0.4;
  cursor: default;
}

#status {
  font-size: 0.85rem;
  min-width: 90px;
  text-align: center;
}

.hint {
  font-size: 0.75rem;
  opacity: 0.75;
  text-align: center;
  margin: 12px 0 0;
  max-width: 420px;
  line-height: 1.5;
}

@media (max-width: 600px) {
  body {
    padding: 18px 12px 24px;
    justify-content: flex-start;
  }

  .header {
    margin-bottom: 20px;
  }

  .book-stage {
    width: 100%;
    padding: 0 8px 12px 5px;
  }

  .book-shell {
    padding: 4px;
  }

  .controls {
    gap: 8px;
    margin-top: 18px;
  }

  .controls button {
    padding: 9px 12px;
    font-size: 0.85rem;
  }

  #status {
    min-width: 75px;
    font-size: 0.75rem;
  }

  .hint {
    padding: 0 8px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="eyebrow">Una invitación muy especial</div>
  <h1>Mis quince años · Salomé</h1>
</header>

<main class="book-stage">
  <div class="book-shell">
    <div id="book">

      <div class="page">
        <img src="page-1.webp" alt="Portada: Salomé, mis quince años">
      </div>

      <div class="page">
        <img src="page-2.webp" alt="Ilustración de jardín y paisaje">
      </div>

      <div class="page">
        <img src="page-3.webp" alt="Mensaje de invitación">
      </div>

      <div class="page">
        <img src="page-4.webp" alt="Fecha, lugar y código de vestuario">
      </div>

      <div class="page">
        <img src="page-5.webp" alt="Confirmación y dedicatoria">

        <div class="personalize">
          <div id="guestName" class="guest-name">
            Nombre del invitado
          </div>
          <div id="validity" class="validity">
            Esta invitación es válida para una persona.
          </div>
        </div>
      </div>

      <div class="page">
        <img src="page-6.webp" alt="Ilustración final de Salomé">
      </div>

    </div>
  </div>
</main>

<div class="controls">
  <button id="prev" type="button" disabled>‹ Anterior</button>
  <span id="status" aria-live="polite">Portada</span>
  <button id="next" type="button">Siguiente ›</button>
</div>

<p class="hint">
  Toca las páginas o utiliza los botones para avanzar.
</p>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<script>
(function () {
  "use strict";

  /* Personalización mediante la dirección web */
  const params = new URLSearchParams(window.location.search);
  const guestName = params.get("invitado") || "Nombre del invitado";
  const requestedPeople = parseInt(params.get("personas") || "1", 10);
  const people = Number.isFinite(requestedPeople)
    ? Math.max(1, requestedPeople)
    : 1;

  document.getElementById("guestName").textContent = guestName;
  document.getElementById("validity").textContent =
    "Esta invitación es válida para " + people +
    (people === 1 ? " persona." : " personas.");

  const bookElement = document.getElementById("book");
  const status = document.getElementById("status");
  const prevButton = document.getElementById("prev");
  const nextButton = document.getElementById("next");
  const totalPages = 6;

  function updateControls(pageIndex) {
    prevButton.disabled = pageIndex <= 0;
    nextButton.disabled = pageIndex >= totalPages - 1;

    if (pageIndex === 0) {
      status.textContent = "Portada";
    } else if (pageIndex >= totalPages - 1) {
      status.textContent = "Final";
    } else {
      status.textContent = "Página " + (pageIndex + 1) +
        " de " + totalPages;
    }
  }

  function showError(message) {
    status.textContent = message;
    prevButton.disabled = true;
    nextButton.disabled = true;
    console.error(message);
  }

  function initializeBook() {
    if (!window.St || !window.St.PageFlip) {
      showError("No se pudo cargar el libro");
      return;
    }

    const pages = document.querySelectorAll("#book .page");

    if (pages.length !== totalPages) {
      showError("Faltan páginas de la invitación");
      return;
    }

    const pageFlip = new St.PageFlip(bookElement, {
      width: 400,
      height: 560,
      size: "stretch",
      minWidth: 280,
      maxWidth: 850,
      minHeight: 392,
      maxHeight: 1190,
      showCover: true,
      usePortrait: true,
      startPage: 0,
      drawShadow: true,
      flippingTime: 800,
      useMouseEvents: true,
      mobileScrollSupport: false,
      maxShadowOpacity: 0.35,
      autoSize: true
    });

    pageFlip.loadFromHTML(pages);

    pageFlip.on("flip", function (event) {
      updateControls(event.data);
    });

    prevButton.addEventListener("click", function () {
      pageFlip.flipPrev();
    });

    nextButton.addEventListener("click", function () {
      pageFlip.flipNext();
    });

    updateControls(0);
  }

  initializeBook();
})();
</script>

</body>
</html>
